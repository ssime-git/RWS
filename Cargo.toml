[package]
name = "rws"
version = "0.1.0"
edition = "2024"
publish = false
description = "Remote workspaces with explicit remote execution"

[dependencies]
libc = "0.2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nfsserve = "0.11"
russh-sftp = "3"
async-trait = "0.1.92"
futures = "0.3.34"
unicode-normalization = "0.1.25"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "process", "time", "io-util", "sync", "macros", "net"] }

[dev-dependencies]
tempfile = "3"
