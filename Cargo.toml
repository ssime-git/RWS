[package]
name = "rws"
version = "0.1.0"
edition = "2024"
publish = false
description = "Remote workspaces with explicit remote execution"

[dependencies]
libc = "0.2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
